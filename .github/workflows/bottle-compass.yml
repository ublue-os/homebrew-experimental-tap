name: Build compass Bottles
on:
  push:
    branches:
      - main
    paths:
      - 'Formula/compass.rb'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.28.2)'
        required: false

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
            echo "Manual version request: ${VERSION}"
          else
            VERSION=$(grep -oP '^  url "https://github.com/[^/]+/[^/]+/archive/refs/tags/v\K[^"]+(?=\.tar\.gz")' Formula/compass.rb)
            echo "Formula version: ${VERSION}"
          fi
          if [ -z "$VERSION" ]; then
            echo "Could not determine version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-bottles:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build bottle
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          export HOMEBREW_NO_AUTO_UPDATE=1

          brew install --build-bottle 'ublue-os/experimental-tap/compass'
          brew bottle --json --root-url="https://github.com/${{ github.repository }}/releases/download/compass-${VERSION}" 'ublue-os/experimental-tap/compass'

      - name: Rename bottle files
        run: |
          for file in *.bottle.*; do
            [[ -f "$file" ]] || continue
            newname="${file/--/-}"
            [[ "$file" != "$newname" ]] && mv "$file" "$newname"
          done

      - name: Upload bottle artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bottle-${{ matrix.id }}
          path: '*.bottle.*'

  publish-bottles:
    needs: [resolve-version, build-bottles]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all bottles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bottle-*
          merge-multiple: true
          path: .

      - name: Publish bottles to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          if gh release view "compass-${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "compass-${VERSION}" ./*.bottle*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "compass-${VERSION}" ./*.bottle*.tar.gz \
              --title "compass ${VERSION} bottles" \
              --notes "Bottles for compass ${VERSION}" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Update formula with bottle SHAs
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          brew bottle --merge --write --no-commit ./*.bottle.json

          if git diff --quiet Formula/compass.rb; then
            echo "No changes"
          else
            git config --global user.email "action@github.com"
            git config --global user.name "GitHub Action"
            git add Formula/compass.rb
            git commit -m "chore: add compass bottles for ${VERSION}"
            git push origin main
          fi
