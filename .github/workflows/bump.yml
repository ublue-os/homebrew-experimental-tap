name: Homebrew Bump

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC

concurrency:
  group: homebrew-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runs brew from master; stable brew evaluates linux-only casks under
      # simulated macOS and fails to rewrite their sha256 stanzas.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # brew audit needs core to resolve bluefin-cli's go dependency
      - name: Tap homebrew/core
        run: brew tap --force homebrew/core

      # Attribute bump commits to the bot that actually opens the PR. This was
      # hardcoded to `lambdaclan`, a real GitHub user who is not a collaborator on
      # this repo, so every automated commit was authored under their identity while
      # the PR itself came from github-actions[bot]. That mismatch is also why the
      # test-bot run on each bump PR sat pending until a maintainer approved it.
      - name: Configure git
        uses: Homebrew/actions/git-user-config@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # main
        with:
          username: github-actions[bot]

      # `brew bump` exits non-zero if any single package fails while still opening
      # PRs for the rest, so failure is tolerated here to let the reporting steps
      # below run. The final step re-raises it so the run is not silently green.
      - name: Bump packages
        id: bump
        continue-on-error: true
        env:
          HOMEBREW_DEVELOPER: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # keep brew bump's exit code across the tee pipe
          set -o pipefail
          brew bump --tap ${{ github.repository }} --open-pr --no-fork 2>&1 | tee bump_output.log

      - name: Create issues for failed audits
        if: steps.bump.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Parse the bump output for audit failures
          if grep -q "brew audit.*failed" bump_output.log; then
            # Extract formula names that failed audit
            grep -B 5 "brew audit.*failed" bump_output.log | grep "^==>" | sed 's/.*==>\s*\[\?1m\?\(.*\)\[\?0m.*/\1/' | while read -r formula; do
              # Skip empty lines
              [ -z "$formula" ] && continue
              
              # Extract the error details for this formula
              error_details=$(awk "/==> .*${formula}/,/brew audit.*failed/" bump_output.log | grep "^\s*\*" || echo "No specific error details found")
              
              # Check if an issue already exists for this formula
              existing_issue=$(gh issue list --repo ${{ github.repository }} --state open --search "in:title brew audit failed: ${formula}" --json number --jq '.[0].number')
              
              if [ -z "$existing_issue" ]; then
                gh issue create \
                  --repo ${{ github.repository }} \
                  --title "brew audit failed: ${formula}" \
                  --label "audit-failure,automated" \
                  --body "## Audit Failure for \`${formula}\`

              The automated bump workflow detected that \`brew audit\` failed for this formula.

              ### Error Details:
              \`\`\`
              ${error_details}
              \`\`\`

              ### Workflow Run:
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              This issue was automatically created by the bump workflow. Please review and fix the formula dependencies or configuration."
                              
                              echo "Created issue for ${formula}"
                            else
                              echo "Issue already exists for ${formula}: #${existing_issue}"
                            fi
                          done
                        fi

      # Without this the job is green on every run, because `continue-on-error`
      # above swallows the failure. That masked 13 packages failing to bump nightly
      # and made the pipeline look healthy while promotion was dead.
      - name: Report bump result
        if: always()
        run: |
          {
            echo "### Homebrew Bump"
            echo
            if [ "${{ steps.bump.outcome }}" = "failure" ]; then
              echo ":x: \`brew bump\` reported errors. Packages that could not be bumped:"
              echo
              echo '```'
              grep -E "^.*##\[error\]|Could not find 'sha256' stanza|brew audit.*failed" bump_output.log \
                | sed 's/##\[error\]//' | sort -u || echo "(see full log)"
              echo '```'
            else
              echo ":white_check_mark: \`brew bump\` completed with no errors."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.bump.outcome }}" = "failure" ]; then
            echo "::error::brew bump reported errors; see the job summary."
            exit 1
          fi
